    volumes:
      - ./apps:/apps
      - ./application-dev.yaml:/application.yaml
    depends_on:
      - hapi-postgres

  hapi-postgres:
    image: postgres:14.1-alpine
    ports:
      - '5432:5432'
    container_name: hapi-postgres
    restart: always
    environment:
      - POSTGRES_DB=hapi
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - hapi-postgres:/var/lib
#      - hapi-postgres:/var/lib/postgresql/data

volumes:
  hapi-postgres:
    driver: local
